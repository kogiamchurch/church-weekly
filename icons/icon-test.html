<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    >

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    >

    <meta
      name="apple-mobile-web-app-title"
      content="奉獻登錄"
    >

    <meta
      name="theme-color"
      content="#4c1d95"
    >

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./icons/donation-icon-180.png"
    >

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icons/donation-icon-192.png"
    >

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icons/donation-icon-512.png"
    >

    <title>奉獻登錄圖示測試</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
        background: #f8f7fb;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }

      .test-card {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        box-sizing: border-box;
        border: 1px solid #ddd6fe;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
        text-align: center;
      }

      .test-icon {
        display: block;
        width: 96px;
        height: 96px;
        margin: 0 auto 20px;
        border-radius: 22px;
      }

      .test-title {
        margin: 0 0 10px;
        color: #101828;
        font-size: 24px;
        line-height: 1.4;
        font-weight: 900;
      }

      .test-text {
        margin: 0;
        color: #667085;
        font-size: 16px;
        line-height: 1.7;
      }
    </style>
  </head>

  <body>
    <main class="test-card">
      <img
        class="test-icon"
        src="./icons/donation-icon-180.png"
        alt="奉獻登錄圖示"
      >

      <h1 class="test-title">
        圖示測試頁
      </h1>

      <p class="test-text">
        如果主畫面顯示上方這個圖示，代表 GitHub Pages 的方式可行。
      </p>
    </main>
  </body>
</html>
